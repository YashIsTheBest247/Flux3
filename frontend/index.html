<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#EFEAE1" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/favicon.svg" />
        <title>Flux - creator automation</title>
        <meta name="description" content="Pick your niche, connect your channel, and let the busywork run itself." />
        <script>
            (function () {
                try {
                    var t = localStorage.getItem('flux-theme') || 'light';
                    document.documentElement.classList.add(t);
                } catch (e) {
                    document.documentElement.classList.add('light');
                }
            })();
        </script>
        <link rel="preconnect" href="https://images.unsplash.com" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

    </body>
</html>

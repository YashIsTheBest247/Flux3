# Keep the Render service awake.
#
# Render idles a web service out after ~15 minutes without inbound traffic. The
# app also pings itself (app/services/keepalive.py), but that only works while
# the process is alive — once Render stops the container, nothing inside it can
# start it again. This workflow is the half that can, because the request comes
# from outside.
#
# Two caveats worth knowing:
#   * GitHub's scheduler is best-effort and drifts under load, sometimes by more
#     than the 15-minute idle window. Register the same URL with an uptime
#     monitor (cron-job.org, UptimeRobot) so there are two independent sources.
#   * GitHub disables scheduled workflows in a repository with no commits for
#     60 days. It will email first.
#
# Setup: Settings -> Secrets and variables -> Actions -> New repository secret
#   RENDER_URL = https://<your-service>.onrender.com   (no trailing slash)
name: keepalive

on:
  schedule:
    # :00, :12, :24, :36, :48 — comfortably inside Render's idle window.
    - cron: "*/12 * * * *"
  workflow_dispatch:

# A backed-up queue should ping once, not replay every missed tick.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /ping
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::warning::RENDER_URL secret is not set — nothing to ping."
            exit 0
          fi
          # --max-time 90 rather than the default: if the instance HAS gone to
          # sleep this request is the one waking it, and a cold start takes the
          # better part of a minute. Timing out at 10s would abandon the wake-up
          # halfway and leave the service asleep.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "${RENDER_URL%/}/ping" || echo "000")
          echo "GET ${RENDER_URL%/}/ping -> $code"
          # Never fail the job. A red X every 12 minutes trains you to ignore
          # the notification, and one missed ping is recovered by the next tick.
          if [ "$code" != "200" ]; then
            echo "::warning::Keep-alive ping returned $code"
          fi

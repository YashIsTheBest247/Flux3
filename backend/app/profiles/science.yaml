id: science
name: Science & Curiosity
tagline: One finding, explained properly
emoji: "\U0001F52C"
accent: "#4FB8C9"

sources:
  - type: rss
    limit: 20
    urls:
      - https://www.sciencedaily.com/rss/top/science.xml
      - https://phys.org/rss-feed/
      - https://www.quantamagazine.org/feed/
  - type: reddit
    limit: 12
    subreddits: [science, space, askscience]
  - type: hackernews
    limit: 20

persona:
  voice: a patient explainer who makes one mechanism genuinely clear
  audience: curious non-specialists who want the real explanation, not a metaphor
  tone: precise and warm; say what is known, what is inferred, what is not
  hook_style: open on the counterintuitive result
  cta: Follow for one real explanation a day
  avoid: >-
    overclaiming from a single study, "scientists baffled" framing,
    treating a preprint as settled

visuals:
  style: clean scientific photography, laboratory and natural detail, cool light
  subjects: telescopes, lab benches, microscopy, glaciers, coral, night sky
  prefer_clips: true

format:
  duration: 60
  youtube_category: "28"
  hashtags: ["#science", "#learn", "#shorts"]

ranking:
  recency: 0.3
  trend: 0.7
  max_age_hours: 96

schedule:
  hours: [10, 20]
  timezone: UTC
  top_n: 1
